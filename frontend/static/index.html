<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropertyBot — AI Real Estate Assistant</title>
<style>
  :root {
    --primary: #0f766e;
    --primary-dark: #0d5d57;
    --primary-light: #ccfbf1;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
    z-index: 10;
    flex-shrink: 0;
  }
  .logo {
    width: 40px; height: 40px;
    background: rgba(255,255,255,.18);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header p { font-size: 12px; opacity: .8; margin-top: 1px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 5px; }
  #chat::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 82%;
    animation: fadeUp .2s ease;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }
  .msg.bot .avatar  { background: var(--primary-light); color: var(--primary-dark); }
  .msg.user .avatar { background: #dbeafe; color: #1d4ed8; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 14px;
    box-shadow: var(--shadow);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--primary);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .bubble p { margin-bottom: 7px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { font-weight: 600; }
  .bubble a { color: #2563eb; text-decoration: underline; word-break: break-all; }
  .msg.user .bubble a { color: #bae6fd; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin-bottom: 3px; }

  .typing { display: flex; gap: 4px; padding: 13px 16px; }
  .typing span {
    width: 7px; height: 7px; background: #94a3b8; border-radius: 50%;
    animation: bounce .6s infinite alternate;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }

  #input-area {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  #msg-input {
    flex: 1;
    padding: 11px 14px;
    border: 2px solid var(--border);
    border-radius: 14px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
    min-height: 44px;
    max-height: 120px;
    resize: none;
    overflow-y: auto;
  }
  #msg-input:focus { border-color: var(--primary); }
  #msg-input::placeholder { color: #94a3b8; }

  #send-btn {
    width: 44px; height: 44px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  #send-btn:hover { background: var(--primary-dark); }
  #send-btn:active { transform: scale(.93); }
  #send-btn:disabled { opacity: .45; cursor: not-allowed; }
  #send-btn svg { width: 18px; height: 18px; }

  .quick-actions {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 16px 10px;
    background: var(--surface);
  }
  .quick-btn {
    padding: 7px 14px;
    background: var(--primary-light);
    color: var(--primary-dark);
    border: 1px solid #99f6e4;
    border-radius: 18px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .quick-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    to { transform: translateY(-5px); opacity: .35; }
  }

  @media (min-width: 768px) {
    #chat { padding: 24px 12%; }
    .msg { max-width: 68%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">&#127968;</div>
  <div>
    <h1>PropertyBot</h1>
    <p>AI Real Estate Assistant — United States</p>
  </div>
</header>

<div id="chat"></div>

<div class="quick-actions" id="quick-actions">
  <button class="quick-btn" onclick="sendQuick('I want to buy a house in Austin under $600k')">Buy in Austin</button>
  <button class="quick-btn" onclick="sendQuick('Rent a 2-bed apartment in Seattle under $3500')">Rent in Seattle</button>
  <button class="quick-btn" onclick="sendQuick('Find homes in Miami around $1M')">Homes in Miami</button>
  <button class="quick-btn" onclick="sendQuick('I need a 1-bed apartment in New York for rent')">Rent in NYC</button>
  <button class="quick-btn" onclick="sendQuick('Show me condos in San Francisco for sale')">Condos in SF</button>
</div>

<div id="input-area">
  <textarea id="msg-input" rows="1" placeholder="Type your message... (Enter to send)"></textarea>
  <button id="send-btn" title="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const quickDiv = document.getElementById('quick-actions');

let sessionId = localStorage.getItem('pb_sid') || null;
let busy = false;

function scrollBottom() {
  requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}

function formatText(raw) {
  let t = raw
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^[-•]\s+(.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>');

  // Markdown links [label](url) -> open in new tab
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  // Bare URLs not already inside an href -> open in new tab
  t = t.replace(/(^|[^"'>])(https?:\/\/[^\s<)]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

  t = t.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');

  t = t.split('\n\n').map(p => {
    if (p.startsWith('<ul>') || p.startsWith('<li>')) return p;
    return '<p>' + p + '</p>';
  }).join('');

  return t.replace(/<p><\/p>/g, '') || raw;
}

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.innerHTML = role === 'bot' ? '&#127968;' : '&#128100;';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(text);

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  scrollBottom();
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'typing';
  el.innerHTML = '<div class="avatar">&#127968;</div><div class="bubble typing"><span></span><span></span><span></span></div>';
  chat.appendChild(el);
  scrollBottom();
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  quickDiv.style.display = 'none';

  addMsg('user', text);
  input.value = '';
  input.style.height = '44px';
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    localStorage.setItem('pb_sid', sessionId);
    hideTyping();
    addMsg('bot', data.response);
  } catch {
    hideTyping();
    addMsg('bot', 'Connection issue — please try again.');
  }

  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

function sendQuick(t) { send(t); }

sendBtn.addEventListener('click', () => send(input.value));
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
input.addEventListener('input', () => {
  input.style.height = '44px';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Safety net: force every link inside the chat to open in a new tab
chat.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || !/^https?:\/\//i.test(href)) return;
  e.preventDefault();
  window.open(href, '_blank', 'noopener,noreferrer');
});

addMsg('bot',
  "**Welcome to PropertyBot!**\n\n" +
  "I can help you find properties to buy or rent anywhere in the US, compare options, and schedule visits.\n\n" +
  "What are you looking for today?"
);
</script>
</body>
</html>
