<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropertyBot — AI Real Estate Assistant</title>
  <link rel="stylesheet" href="static/style.css">
</head>

<body>

  <header>
    <div class="logo">&#127968;</div>
    <div>
      <h1>PropertyBot</h1>
      <p>AI Real Estate Assistant — United States</p>
    </div>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">Dark Mode</span>
    </button>
  </header>

  <div id="chat"></div>

  <div class="quick-actions" id="quick-actions">
    <button class="quick-btn" onclick="sendQuick('I want to buy a house in Austin under $600k')">Buy in Austin</button>
    <button class="quick-btn" onclick="sendQuick('Rent a 2-bed apartment in Seattle under $3500')">Rent in Seattle</button>
    <button class="quick-btn" onclick="sendQuick('Find homes in Miami around $1M')">Homes in Miami</button>
    <button class="quick-btn" onclick="sendQuick('I need a 1-bed apartment in New York for rent')">Rent in NYC</button>
    <button class="quick-btn" onclick="sendQuick('Show me condos in San Francisco for sale')">Condos in SF</button>
  </div>

  <div id="input-area">
    <button id="tip-toggle" title="Quick actions" onclick="toggleQuickTip()">?</button>
    <textarea id="msg-input" rows="1" placeholder="Type your message... (Enter to send)"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- Quick Actions Floating Card -->
  <div id="quick-tip" class="quick-tip hidden">
    <div class="quick-tip-header">
      <span>Quick Actions</span>
      <button onclick="hideQuickTip()">&times;</button>
    </div>
    <div class="quick-tip-body">
      <button class="tip-action" onclick="fillInput('Compare Option 3 and Option 8')">
        Compare properties
        <small>Example: Compare Option 3 and Option 8</small>
        <small>Example: Compare Option 2, 6 and 10</small>
      </button>
      <button class="tip-action" onclick="fillInput('Schedule a visit for Option 5')">
        Schedule a visit
        <small>Example: Schedule a visit for Option 5</small>
      </button>
    </div>
  </div>

  <script src="static/app.js"></script>
</body>

</html>
