<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropertyBot — AI Real Estate Assistant</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <div class="logo">
      <span class="material-symbols-outlined logo-icon">waving_hand</span>
    </div>
    <div class="brand-title">
      <h1>PropertyBot AI</h1>
    </div>
    <div class="header-actions">
      <button id="new-search-btn" class="new-search-btn" title="Start a fresh search">
        <span class="material-symbols-outlined">refresh</span>
        <span>New Search</span>
      </button>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
        <span id="theme-icon" class="material-symbols-outlined">dark_mode</span>
        <span id="theme-text">Dark Mode</span>
      </button>
    </div>
  </header>

  <main class="main-container">
    <div id="chat">
      <div id="empty-state">
        <div class="hero-section">
          <p class="hero-greeting">Welcome to PropertyBot</p>
          <h1 class="hero-title">What would you like to know?</h1>
          <p class="hero-subtitle">Use one of the most common prompts below<br>or ask your own to begin</p>
        </div>

        <div class="cards-grid" id="quick-actions">
          <button class="prompt-card" onclick="sendQuick('I want to buy a 3-bedroom house in Austin under $600k')">
            <div class="card-icon-wrap">
              <span class="material-symbols-outlined">home</span>
            </div>
            <div class="card-text">Buy a 3-bedroom house in Austin under $600k</div>
          </button>
          <button class="prompt-card" onclick="sendQuick('Rent a 2-bed apartment in Seattle under $3500')">
            <div class="card-icon-wrap">
              <span class="material-symbols-outlined">mail</span>
            </div>
            <div class="card-text">Rent a 2-bed apartment in Seattle under $3500</div>
          </button>
          <button class="prompt-card" onclick="sendQuick('Find luxury condos in Miami around $1M')">
            <div class="card-icon-wrap">
              <span class="material-symbols-outlined">bubble_chart</span>
            </div>
            <div class="card-text">Find luxury condos in Miami around $1M</div>
          </button>
        </div>
      </div>
    </div>

    <div id="input-area-wrapper">
      <div id="input-area" class="input-pill">
        <!-- <button id="tip-toggle" class="pill-left-btn" title="Quick actions" onclick="toggleQuickTip()">
          <span class="material-symbols-outlined">link</span>
        </button> -->
        <textarea id="msg-input" rows="1" placeholder="Ask whatever you want..."></textarea>
        <button id="send-btn" class="pill-send-btn" title="Send">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>
    </div>
  </main>

  <button id="scroll-bottom-btn" class="scroll-bottom-btn" aria-label="Scroll to bottom">
    <span class="material-symbols-outlined">arrow_downward</span>
  </button>

  <!-- Quick Actions Floating Card (Commented Out)
  <div id="quick-tip" class="quick-tip hidden">
    <div class="quick-tip-header">
      <span>Quick Actions</span>
      <button onclick="hideQuickTip()">&times;</button>
    </div>
    <div class="quick-tip-body">
      <button class="tip-action" onclick="fillInput('Compare Option 3 and Option 8')">
        Compare properties
        <small>Example: Compare Option 3 and Option 8</small>
        <small>Example: Compare Option 2, 6 and 10</small>
      </button>
      <button class="tip-action" onclick="fillInput('Schedule a visit for Option 5')">
        Schedule a visit
        <small>Example: Schedule a visit for Option 5</small>
      </button>
    </div>
  </div> -->
  <script src="static/app.js"></script>
</body>

</html>
